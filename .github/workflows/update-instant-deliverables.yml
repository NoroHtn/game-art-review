# Upload this one file to .github/workflows/update-instant-deliverables.yml
# in NoroHtn/game-art-review and commit it to main.
# It builds the 25-page PDF from the existing approved assets, updates only
# Instant Deliverables, and requests the repository's existing Pages deployment.
# It does not edit Crash, the Figma document, original exports or other Instant pages.
name: Update Instant Deliverables and presentation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-instant-deliverables.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: instant-deliverables-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the current website
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install presentation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-urw-base35
          python -m pip install --disable-pip-version-check 'reportlab==4.4.9' 'Pillow==12.3.0' 'PyMuPDF==1.26.7'
      - name: Build the 25-page Instant presentation
        env:
          INSTANT_ASSET_ROOT: ${{ github.workspace }}/assets/instant-final
          INSTANT_PDF_OUTPUT: ${{ github.workspace }}/assets/instant-final/downloads/Pirate_Sea_Hop_Test_Presentation_25p.pdf
          INSTANT_LAYOUT_REPORT: ${{ runner.temp }}/instant-presentation-layout.json
        run: |
          python - <<'PY_BUILD'
          from __future__ import annotations
          from pathlib import Path
          import json, io, hashlib, re, os
          from xml.sax.saxutils import escape
          from PIL import Image
          from reportlab.pdfgen import canvas
          from reportlab.pdfbase import pdfmetrics
          from reportlab.lib.colors import HexColor, Color
          from reportlab.lib.utils import ImageReader
          from reportlab.platypus import Paragraph, Table, TableStyle
          from reportlab.lib.styles import ParagraphStyle

          ROOT=Path(os.environ.get('INSTANT_ASSET_ROOT', '/mnt/data/game-art-review/assets/instant-final'))
          OUT=Path(os.environ.get('INSTANT_PDF_OUTPUT', '/mnt/data/Pirate_Sea_Hop_Test_Presentation.pdf'))
          OUT.parent.mkdir(parents=True, exist_ok=True)
          M=json.loads((ROOT/'manifest.json').read_text())
          assert len(M['references']) == 9, 'The reference selection has changed; review before rebuilding.'
          assert len(M['states']) == 10, 'The screen-state set has changed; review before rebuilding.'
          W,H=1080,607.492919921875
          BG='#F4F0E3'; INK='#142D31'; TEAL='#315F69'; DARK='#0E2226'; CREAM='#F4E6BE'; GOLD='#E7B96A'; MUTED='#5F7175'; RULE='#CBD0C8'
          # Use the same type families embedded in the supplied Crash presentation.
          for short, family in [('Bookman','URWBookman-Demi'),('Sans','NimbusSans-Regular'),('SansBold','NimbusSans-Bold')]:
              face=pdfmetrics.EmbeddedType1Face('/usr/share/fonts/type1/urw-base35/'+family+'.afm','/usr/share/fonts/X11/Type1/'+family+'.pfb')
              pdfmetrics.registerTypeFace(face)
              pdfmetrics.registerFont(pdfmetrics.Font(short,face.name,'WinAnsiEncoding'))
          pdfmetrics.registerFontFamily('Sans',normal='Sans',bold='SansBold')
          pdfmetrics.registerFontFamily('Bookman',normal='Bookman',bold='Bookman',italic='Bookman',boldItalic='Bookman')
          pdfmetrics.registerFontFamily('SansBold',normal='SansBold',bold='SansBold')
          C=canvas.Canvas(str(OUT),pagesize=(W,H),pageCompression=1,invariant=1)
          C.setTitle('Pirate Sea Hop - Art direction and production plan')
          C.setAuthor('Norair Harutyunyan')
          C.setSubject('25-page Instant game presentation; structure matched to the supplied Crash presentation')
          C.setKeywords('Pirate Sea Hop, Instant game, game art review, final artwork, September 2026')
          PAGE=0
          bounds=[]


          def col(value): return HexColor(value)
          def rect(x,y,w,h,fill,stroke=None,width=.6,radius=0):
              C.setFillColor(col(fill)); C.setStrokeColor(col(stroke or fill)); C.setLineWidth(width)
              if radius:C.roundRect(x,H-y-h,w,h,radius,fill=1,stroke=bool(stroke))
              else:C.rect(x,H-y-h,w,h,fill=1,stroke=bool(stroke))
          def text(t,x,y,w,size=20,font='Sans',color=INK,leading=None,maxh=None,align=0):
              st=ParagraphStyle('p',fontName=font,fontSize=size,leading=leading or size*1.21,textColor=col(color),spaceBefore=0,spaceAfter=0,alignment=align)
              p=Paragraph(t,st); pw,ph=p.wrap(w,1000)
              if maxh is not None and ph>maxh+.1:raise ValueError(f'Page {PAGE}: text overflow ({ph:.1f}>{maxh}): {t[:80]}')
              if y+ph>H-24:raise ValueError(f'Page {PAGE}: footer overflow {t[:80]}')
              p.drawOn(C,x,H-y-ph)
              bounds.append({'page':PAGE,'kind':'text','x':x,'y':y,'w':w,'h':ph,'text':re.sub('<[^>]+>','',t)})
              return ph

          def image(p,x,y,w,h,trim=False,link=None):
              p=Path(p); im=Image.open(p)
              if trim and im.mode=='RGBA':
                  box=im.getchannel('A').getbbox()
                  if box:im=im.crop(box)
              r=min(w/im.width,h/im.height); dw,dh=im.width*r,im.height*r
              xx,yy=x+(w-dw)/2,y+(h-dh)/2
              # Flatten only the display copy onto the uniform slide field; original files are untouched.
              if im.mode=='RGBA':
                  flat=Image.new('RGB',im.size,'#000000' if PAGE==1 else BG); flat.paste(im,(0,0),im); im=flat
              else: im=im.convert('RGB')
              encoded=io.BytesIO(); im.save(encoded,format='JPEG',quality=95,subsampling=0,optimize=True); encoded.seek(0)
              C.drawImage(ImageReader(encoded),xx,H-yy-dh,dw,dh)
              if link:C.linkURL(link,(xx,H-yy-dh,xx+dw,H-yy),relative=0,thickness=0)
              bounds.append({'page':PAGE,'kind':'image','x':xx,'y':yy,'w':dw,'h':dh,'file':str(p.relative_to(ROOT))})
              return (xx,yy,dw,dh)

          def asset(name,x,y,w,h,trim=True):
              return image(ROOT/'art'/name,x,y,w,h,trim, 'https://norohtn.github.io/game-art-review/assets/instant-final/art/'+name)

          def screen(device,n,x,y,w,h):
              f=f'{device}-{n:02d}.webp'
              return image(ROOT/'screens'/f,x,y,w,h,False,'https://norohtn.github.io/game-art-review/assets/instant-final/screens/'+f)

          def start(title='',subtitle='',dark=False):
              global PAGE
              if PAGE:C.showPage()
              PAGE+=1
              rect(0,0,W,H,DARK if dark else BG)
              C.bookmarkPage(f'page-{PAGE}')
              C.addOutlineEntry(title or 'Pirate Sea Hop',f'page-{PAGE}',level=0,closed=False)
              if title:text(escape(title),50,46,985,35.3,'Bookman',CREAM if dark else INK,maxh=49)
              if subtitle:text(escape(subtitle),52,100,976,18,'Sans','#BBC8C8' if dark else MUTED,maxh=43)
              if PAGE>1:
                  C.setFont('Sans',12);C.setFillColor(col('#A6B6B7' if dark else TEAL));C.drawRightString(1029,17,f'{PAGE:02d}')

          def block(title,body,x,y,w=460,size=20,color=INK,accent=TEAL):
              th=text(escape(title),x,y,w,21.8,'SansBold',accent)
              return th+text(body,x,y+th+12,w,size,'Sans',color)

          def tbl(headers,rows,x,y,widths,fs=17,row_heights=None,dark=False,maxh=None,pad=10.5):
              headbg='#152F33';even='#E9E5D8';odd=BG; bodycolor=INK
              if dark:headbg='#163237';even='#1B343B';odd='#213E47';bodycolor='#D5DEDA'
              def cell(s,head=False):
                  return Paragraph(escape(str(s)).replace('\n','<br/>'),ParagraphStyle('cell',fontName='SansBold' if head else 'Sans',fontSize=fs,leading=fs*1.22,textColor=col(CREAM if head else bodycolor)))
              data=[[cell(v,True) for v in headers]]+[[cell(v) for v in r] for r in rows]
              t=Table(data,colWidths=widths,rowHeights=row_heights)
              t.setStyle(TableStyle([('BACKGROUND',(0,0),(-1,0),col(headbg)),('VALIGN',(0,0),(-1,-1),'TOP'),('LEFTPADDING',(0,0),(-1,-1),12),('RIGHTPADDING',(0,0),(-1,-1),12),('TOPPADDING',(0,0),(-1,-1),pad),('BOTTOMPADDING',(0,0),(-1,-1),pad),('GRID',(0,0),(-1,-1),.6,col('#091D23' if dark else '#566560'))]+[('BACKGROUND',(0,i),(-1,i),col(even if i%2==0 else odd)) for i in range(1,len(data))]))
              tw,th=t.wrap(sum(widths),H)
              if maxh is not None and th>maxh:raise ValueError(f'table overflow p{PAGE}: {th}>{maxh}')
              if y+th>H-38:raise ValueError(f'table page overflow p{PAGE}: {y+th}')
              t.drawOn(C,x,H-y-th);return th

          # 01 - cover, using original approved artwork, not a generated replacement.
          start()
          rect(0,0,W,H,'#000000')
          text('PIRATE<br/>SEA HOP',56,116,535,62,'Bookman',CREAM,leading=68,maxh=150)
          text('Pirate crossing instant game',58,340,510,23,'Sans',CREAM)
          text('Art direction and production plan',58,385,515,21,'Sans',GOLD)
          text('Norair Harutyunyan',58,518,480,18,'Sans',CREAM)
          text('Review presentation  |  September 2026',58,552,540,14,'Sans','#A3ACAA')
          asset('9E1C401B-9D30-43E1-BC18-7CA63C973A00.webp',617,71,406,435)

          # 02 - game idea, intended audience and distinction.
          start('One more jump. Or take the treasure.',dark=True)
          text('A pirate crosses a dangerous sea.<br/>Every safe landing opens the next decision.',54,127,960,29,'Bookman',CREAM,leading=36,maxh=82)
          block('Game idea','Choose a stake and difficulty, then jump between floating crates and barrels. Continue after a safe landing or cash out the confirmed return.',56,268,455,20,'#DBE2DD',GOLD)
          block('Intended audience','Adults of legal gambling age who prefer short instant-game sessions. This is a planning hypothesis, not a validated audience finding.',570,268,455,20,'#DBE2DD',GOLD)
          block('Design distinction','A visible route, a map-carrying pirate and distinct sea encounters make progress recognizable without adding steering or combat.',56,460,965,20,'#DBE2DD',GOLD)

          # 03 - same two-column principles / example / palette structure.
          start('Visual principles')
          block('Decision hierarchy','Read the pirate and next landing target first. Keep the current multiplier and cashout amount stable and separate from scenery.',54,122,480)
          block('Drawing and materials','Polished, stylized 3D forms, warm sculpted wood, broad bevels and gold trim. Shared lighting and foam keep the objects in one world.',54,287,480)
          block('Mobile clarity','A broad tricorn, clear silhouette and readable landing surfaces carry the action. Preserve bold outlined multipliers over bright water.',54,451,480,19)
          asset('4E9A539F-8C87-4833-8AD0-751FFB96225C.webp',619,112,172,157)
          asset('A11CDB16-D724-43C1-88CA-EC587CB058C3.webp',826,112,164,157)
          text('Route materials and readable landing surfaces',586,286,440,17,'SansBold',TEAL)
          tbl(['Color role','Application'],[
          ['Turquoise water','Continuous playfield'],['Warm wood and gold','Route and framing'],['Navy control panel','Control separation'],['Green / yellow','Advance / cashout']
          ],584,337,[238,210],fs=15.8,maxh=222)

          # 04 - all nine approved references in exact current order, uncropped.
          start('Moodboard','Nine selected references in the approved order. Supplied inspiration; authorship is not claimed.')
          ref_titles=['01  Character proportions','02  Siren silhouette','03  Shark expression','04  Coastal atmosphere','05  Treasure island','06  Sculpted world','07  Wood and metal','08  Treasure map','09  Barrel construction']
          for i,r in enumerate(M['references']):
              x=54+(i%3)*337;y=145+(i//3)*139
              image(ROOT/'references'/r['file'],x,y,298,104,False,'https://norohtn.github.io/game-art-review/assets/instant-final/references/'+r['file'])
              text(ref_titles[i],x,y+111,309,15.4,'SansBold',TEAL,maxh=22)

          # 05 / 06 - all four latest boards, not the old turnaround.
          start('Character performance')
          image(ROOT/'characters'/'01-pirate.png',50,141,475,267)
          image(ROOT/'characters'/'02-siren.png',555,141,475,267)
          block('Pirate: the route\'s decision-maker','Front, back and three-quarter views. The tricorn, hook, red scarf and treasure map define the gameplay silhouette.',54,435,471,19)
          block('Siren: a distinct sea encounter','Front, back and three-quarter views. The full body and tail establish a clear character, beyond the separate encounter pose.',559,435,471,19)
          start('Kraken and shark')
          image(ROOT/'characters'/'03-kraken.png',50,138,475,267)
          image(ROOT/'characters'/'04-shark.png',555,138,475,267)
          block('Kraken: the tentacle encounter','Full-body front, back and three-quarter views. Keep the round forms and purple tentacles consistent in gameplay.',54,433,471,19)
          block('Shark: the route\'s interruption','Full-body front, back and three-quarter views. Fins, tail and open-mouth silhouette carry the reaction.',559,433,471,19)

          # 07 - current full route with supporting current assets.
          start('Environment and composition')
          asset('environment-overview.png',58,115,198,440,False)
          asset('26D24F74-3FA2-4ADF-B2E8-820291B58905.webp',289,136,172,187)
          asset('3236F1F2-7BF0-4BC5-9E1B-6EC48E0CAAB2.webp',468,136,172,187)
          asset('4E9A539F-8C87-4833-8AD0-751FFB96225C.webp',292,372,167,146)
          asset('A11CDB16-D724-43C1-88CA-EC587CB058C3.webp',481,372,150,146)
          text('Starting ship',297,335,165,16,'SansBold',TEAL)
          text('Treasure island',479,335,170,16,'SansBold',TEAL)
          text('Crate',309,527,130,16,'SansBold',TEAL)
          text('Barrel',495,527,130,16,'SansBold',TEAL)
          block('A clear centerline','Keep the pirate and next target aligned. The complete route runs from the ship to the treasure island.',690,128,340,18.8)
          block('Depth and grounding','Use water gaps, contact shadows and shared perspective. Keep foam away from important values.',690,285,340,18.8)
          block('Mobile composition','Protect the hero and controls before peripheral scenery. Validate water seams in the engine.',690,437,340,18.8)

          # 08 - mobile first, as requested in the current Instant review.
          start('Main game screen: mobile')
          text('Ready to bet',54,107,241,17,'SansBold',TEAL)
          text('First safe landing',315,107,241,17,'SansBold',TEAL)
          screen('mobile',1,52,141,240,427)
          screen('mobile',3,314,141,240,427)
          block('A compact scene','The pirate and next landing target stay visible above the control panel.',604,146,418,20)
          block('A clear decision','Stake and difficulty establish the round. A safe landing exposes JUMP and CASHOUT.',604,294,418,20)
          block('Responsive validation','Check 360, 390 and 430 px widths, long amounts and browser safe areas.',604,466,418,20)

          # 09 - secondary desktop screen, full original aspect ratio.
          start('Main game screen: desktop')
          screen('desktop',3,46,126,754,439)
          block('Primary read','The pirate, target and current multiplier anchor the route.',836,130,194,18)
          block('Separate actions','JUMP and CASHOUT stay together in the lower control panel.',836,288,194,18)
          block('Quiet edges','Wreckage and encounters sit beside the active crossing.',836,425,194,18)

          # 10 - first six mobile screens, in source order.
          start('Crossing sequence: mobile','The first six supplied views carry the route from the starting ship to the next jump.')
          seq=['01  Ready to bet','02  First jump','03  Safe landing','04  Route advances','05  Barrel landing','06  Next jump']
          for i,lab in enumerate(seq):
              x=52+i*165
              text(lab,x,149,151,15.5,'SansBold',TEAL,maxh=43)
              screen('mobile',i+1,x,193,151,270)
          block('One shared route','The composition follows the pirate. After a confirmed safe landing, the next platform remains visible before another advance.',54,493,970,19)

          # 11 - same sequence on desktop, 3 by 2.
          start('Crossing sequence: desktop','The corresponding six landscape views preserve the same left-to-right source order.')
          for i,lab in enumerate(seq):
              x=52+(i%3)*335;y=144+(i//3)*222
              text(lab,x,y,311,16.6,'SansBold',TEAL,maxh=24)
              screen('desktop',i+1,x,y+28,311,169)

          # 12-18 - matching mobile/desktop evidence pages, mobile placed first.
          pairs=[
          (2,'First jump: leave the ship','The pirate leaves the starting deck. Advance input stays locked while the jump resolves.'),
          (3,'Safe landing: advance or cash out','After a successful landing, JUMP continues the crossing and CASHOUT offers the confirmed return.'),
          (5,'Barrel landing: a stable decision pose','The pirate is grounded on a barrel. The next target remains visible above the current platform.'),
          (7,'Tentacle encounter','A purple tentacle interrupts the route with a distinct silhouette and character reaction.'),
          (8,'Shark encounter','The shark encounter provides a separate losing-state visual without changing the control layout.'),
          (9,'Mermaid encounter','The supplied mermaid encounter is the Siren losing-state visual in the finished screen exports.'),
          (10,'Cashout: win confirmation','The YOU WIN panel displays the supplied $246 example. Production settlement uses the confirmed result.')
          ]
          for n,title,sub in pairs:
              start(title,sub)
              text('MOBILE',53,135,242,15,'SansBold',TEAL)
              text('DESKTOP',316,135,710,15,'SansBold',TEAL)
              screen('mobile',n,51,166,225,400)
              screen('desktop',n,313,157,717,418)

          # 19 - newest combined tentacles and all three losing references.
          start('Motion direction','Supplied pose references. The timings below are proposals, not completed animation exports.')
          motion=[('8CAD8D7F-C7F5-440F-BF79-7601DB8E6408.webp','Decision pose'),('9E1C401B-9D30-43E1-BC18-7CA63C973A00.webp','Jump with map'),('tentacles-combined.png','Tentacles - combined layer'),('DF70CFF3-41E1-436F-A3B7-CD210B5A7C4E.webp','01  Shark losing reference'),('17FC7B14-020B-4501-AC7E-A98463E068A9.webp','02  Siren losing reference'),('kraken-losing-state-03.png','03  Kraken losing reference')]
          for i,(f,lab) in enumerate(motion):
              x=53+(i%3)*251;y=153+(i//3)*205
              asset(f,x,y,225,157)
              text(lab,x,y+169,235,15.2,'SansBold',TEAL,maxh=37)
          block('Jump and landing','Jump: 550-700 ms.<br/>Landing: 150-250 ms.<br/>Share takeoff and ground-contact events.',825,158,207,17.5)
          block('Encounters','800-1,100 ms.<br/>Keep each encounter<br/>silhouette distinct.',825,327,207,17.5)
          block('Cashout / reset','Cashout: 600-900 ms.<br/>Reset: 300-450 ms.<br/>No settlement by motion.',825,456,207,17.2)

          # 20 - the state contract, matching the dark table page of Crash.
          start('One route. One confirmed outcome.','State contract for the native UI build; additional error screens remain production work.',dark=True)
          tbl(['Stage','Controls and feedback','Production requirement'],[
          ['Ready','Stake and difficulty editable; BET available.','No cashout before a successful landing.'],
          ['Resolving','An advance or cashout is pending.','Lock repeated input until the outcome is confirmed.'],
          ['Active','JUMP and CASHOUT available.','Update multiplier and return together after success.'],
          ['Settled / lost','Show the receipt or losing result.','Settle once. Reset after the result is acknowledged.'],
          ['Errors / reconnect','Retain the last confirmed round state.','Show why an action is unavailable; recover from authority.']
          ],52,146,[159,390,427],fs=18.5,dark=True,maxh=337,pad=9)
          text('A confirmed result controls the UI. Animation presents that result.',55,492,964,21,'SansBold',GOLD)
          text('Exported amounts are illustrative. Mixed decimal separators and repeated cashout values need reconciliation with the game rules in production.',55,536,968,17.5,'Sans','#D2DDDA',maxh=43)

          # 21 - estimates from the current Instant production plan, not copied from Crash.
          start('Team ownership and workload','Planning estimate for one UI Designer, one 2D Artist and one Spine Animator.')
          tbl(['Owner','Owned deliverables','Depends on','Person-days'],[
          ['UI Designer','Layouts, components, states, device QA and handoff.','Direction and mobile composition','8'],
          ['2D Artist','Asset audit, character layers, environment, encounter layers and cleanup.','Composition and rig feasibility','10'],
          ['Spine Animator','Rig, idle, jump, landing, encounters, cashout, reset and integration.','Separated art and one approved test jump','8'],
          ['Art Lead','Direction, scope, review gates, risks and submission checks.','Supplied brief and visual direction','3'],
          ['Total','Parallel art and UI production cycle.','15 working days elapsed','29']
          ],51,139,[183,395,260,140],fs=17,maxh=362)
          text('26 specialist person-days plus 3 overlapping Art Lead days. Engineering, mathematics, backend, audio and certification require separate estimates.',54,532,968,17.5,'Sans',MUTED,maxh=43)

          # 22 - source milestone schedule, same design as Crash.
          start('Milestones across 15 working days','Each gate protects the work that depends on it.')
          tbl(['Window','Main work','Acceptance gate'],[
          ['Days 1-2','Direction and layout lock.','Approve route, phone hierarchy, silhouette, materials and rig feasibility.'],
          ['Days 3-5','Assets and component kit.','Named layers, editable UI states and a working rig with one test jump.'],
          ['Days 6-10','Motion and integration.','Connect idle, jump, landing, encounters, cashout and reset.'],
          ['Days 11-13','Device and state QA.','Check 360/390/430 px phones, desktop, contrast, reduced motion and reconnect.'],
          ['Days 14-15','Correction buffer and handoff.','Resolve findings, verify exports and review the Figma/PDF submission.']
          ],51,140,[164,339,475],fs=17.5,maxh=373)
          text('The specialists work in parallel. These are planning estimates; re-estimate after the mobile layout and rig feasibility checks.',54,542,966,17.5,'Sans',MUTED,maxh=43)

          # 23 - handoffs, same three numbered gates as Crash.
          start('Review gates and production handoffs')
          block('01  Composition approval','UI and 2D review the same mobile-first and desktop compositions. The pirate, next target, multiplier and cashout action must remain readable at game size.',55,141,971,21)
          block('02  Rig feasibility','Separate character and effect parts, reconstruct hidden overlaps and share a ground pivot. Approve one complete jump and landing before producing every encounter variant.',55,301,971,21)
          block('03  Integrated acceptance','Review art inside the actual UI states. Assign an owner to every blocker, verify confirmed outcomes and reduced motion, and reserve the final two days for corrections and handoff.',55,461,971,21)

          # 24 - risks from the current site.
          start('Risks and mitigation')
          tbl(['Risk','Mitigation','Owner / checkpoint'],[
          ['Busy water','Protect outlines and stable readouts; test contrast at phone scale.','UI + Art Lead\nLayout and final QA'],
          ['Flat PNG assets','Separate limbs and effects; reconstruct hidden overlaps before rigging.','2D + Animator\nRig feasibility'],
          ['Landing mismatch','Share ground pivots and camera direction; approve one jump first.','Animator + Engineering\nJump test'],
          ['Payout mismatch','Use authoritative values, consistent decimals and single settlement.','UI + Engineering\nState integration'],
          ['Water seams and clutter','Verify water tiling; keep encounter effects away from readable values.','2D + Animator\nScene review'],
          ['Scope growth','Freeze direction, use review gates and protect the correction buffer.','Art Lead\nDaily scope review']
          ],51,124,[230,459,289],fs=16.8,maxh=431)

          # 25 - same source / completeness / Figma ending, truthful handoff status.
          start('Final assets and Figma source',dark=True)
          block('Complete character set','Pirate, Siren, Kraken and Shark boards with full-body views, plus gameplay and losing-state poses.',55,147,461,21,'#DCE3DD',GOLD)
          block('20 final game screens','Mobile: 10 corresponding views.<br/>Desktop: 10 corresponding views.<br/>Source order and artwork preserved.',571,147,457,21,'#DCE3DD',GOLD)
          text('Figma: supplied Instant game section',55,334,968,28,'Bookman',CREAM)
          text('Norair Harutyunyan Test Task - INSTANT GAME',55,389,961,21,'Sans','#DCE3DD')
          text('Selected section: 8-10993',55,423,960,17,'Sans','#BBC8C8')
          rect(55,467,282,47,GOLD,radius=7)
          text('Open Instant game in Figma',69,481,253,17.5,'SansBold',DARK)
          C.linkURL(M['figma'],(55,H-514,337,H-467),relative=0,thickness=0)
          text('Approved artwork and production planning in one review. Editable layers, completed Spine exports and final Figma/PDF alignment remain production handoff checks.',55,543,968,16.2,'Sans','#BAC9C7',maxh=40)

          assert PAGE==25,PAGE
          C.save()
          report=os.environ.get('INSTANT_LAYOUT_REPORT', '/mnt/data/_work/presentation-layout.json')
          if report:
              Path(report).parent.mkdir(parents=True, exist_ok=True)
              Path(report).write_text(json.dumps(bounds,indent=2))
          print(OUT,OUT.stat().st_size)

          PY_BUILD
      - name: Match Instant Deliverables to the Crash structure
        env:
          SITE_ROOT: ${{ github.workspace }}
        run: |
          python - <<'PY_PATCH'
          """Update only Instant Deliverables, preserving every other section and Crash."""
          from pathlib import Path
          import json
          import os
          import re

          ROOT = Path(os.environ.get('SITE_ROOT', '/mnt/data/game-art-review')).resolve()
          VERSION = '20260922-deliverables-25p-v1'
          PDF = 'assets/instant-final/downloads/Pirate_Sea_Hop_Test_Presentation_25p.pdf'

          DELIVERABLES = r''' deliverables:()=>`<article class="case-chapter instant-deliverables"><p class="art-kicker">09 / DELIVERABLES</p><h1>What is ready. What remains.</h1><p class="intro">Review evidence is available in this website. The assignment’s final submission format is a Figma presentation and a matching PDF.</p>
          <div class="submission-grid"><section class="submission-card" id="figma"><span class="status">Available</span><h2>Figma presentation</h2><p>Pirate Sea Hop Instant game. This link opens the specific game section supplied with the final screen exports.</p><div class="preview-actions"><a class="link-button primary" href="${esc(m.figma)}" target="_blank" rel="noopener noreferrer">Open Instant game in Figma ↗</a><button id="copy-figma" class="link-button" type="button">Copy Figma link</button></div><input id="figma-url" aria-label="Figma section link" type="text" readonly value="${esc(m.figma)}" spellcheck="false" hidden><p id="copy-status" class="notice" role="status" aria-live="polite"></p></section><section class="submission-card" id="pdf"><span class="status">Available</span><h2>Presentation PDF</h2><p>25-page presentation covering the concept, nine selected references, all four characters, all 20 final screens and production plan, including the updated environment and three losing-state references.</p><div class="preview-actions"><a class="link-button primary" href="${A}downloads/Pirate_Sea_Hop_Test_Presentation_25p.pdf" target="_blank" rel="noopener">Open PDF</a><a class="link-button" href="${A}downloads/Pirate_Sea_Hop_Test_Presentation_25p.pdf" download="Pirate_Sea_Hop_Test_Presentation.pdf">Download PDF</a></div></section></div>
          <section id="figma-exports"><h2>Final Figma screen exports</h2><div class="delivery-links"><a href="${A}downloads/Instant_Mobile.pdf" target="_blank" rel="noopener"><strong>Mobile · game screens ↗</strong><span>Original Figma export · 10 screens</span></a><a href="${A}downloads/Instant_Web.pdf" target="_blank" rel="noopener"><strong>Desktop · game screens ↗</strong><span>Original Figma export · 10 screens</span></a></div><div class="next-links"><a class="link-button" href="${H('final-ui')}">Browse all 20 screens</a></div></section>
          <section><h2>Available review evidence</h2><div class="delivery-links"><a href="${H('brief')}"><strong>Concept &amp; brief</strong><span>Idea, theme, audience and differentiation</span></a><a href="${H('art-direction')}"><strong>Art direction</strong><span>Nine selected references and visual principles</span></a><a href="${H('character-concept')}"><strong>Character boards</strong><span>Pirate, Siren, Kraken and Shark</span></a><a href="${H('environment')}"><strong>Environment</strong><span>Complete route, starting ship and treasure island</span></a><a href="${H('final-ui')}"><strong>Game screens</strong><span>Final mobile and desktop Figma screens</span></a><a href="${H('states')}"><strong>UI state library</strong><span>Ten named game states in source order</span></a><a href="${H('animation')}"><strong>Motion direction</strong><span>Combined tentacles, three losing references and proposed timings</span></a><a href="${H('production')}"><strong>Production plan</strong><span>Workload, milestones, timeline and risks</span></a></div><h3>Original source downloads</h3><div class="delivery-links">${download('Instant_Game_Assets.zip','Game assets','21 original PNG assets; newer boards are on the Characters page')}${download('Instant_References.zip','Reference pack','Original 15-image archive; nine references selected for this review')}${download('Assignment_Brief.pdf','Test assignment','Original requirements')}</div></section>
          <section><h2>Production handoff still required</h2><div class="table-wrap"><table><thead><tr><th scope="col">Package</th><th scope="col">Current evidence</th><th scope="col">Remaining work</th></tr></thead><tbody><tr><td>Source illustration</td><td>Four character boards, environment, props and encounter poses</td><td>Editable sources, separated layers and reconstructed hidden areas</td></tr><tr><td>Spine animation</td><td>Jump and encounter poses with proposed timing and event direction</td><td>Continuous rigs, grounded landings, encounter and reset animation, exports</td></tr><tr><td>Interface handoff</td><td>20 original screen views and a written runtime state contract</td><td>Verify native components, reconcile example values and complete errors and reconnect states</td></tr><tr><td>Submission</td><td>This review website, 25-page presentation PDF and production plan</td><td>Align the full presentation with the supplied Figma file and verify reviewer access</td></tr></tbody></table></div></section>
          <section class="review-note"><h2>Before submitting</h2><ul><li>Make the PDF and Figma tell the same story in the same order.</li><li>Include the main game screen at readable scale, with mobile as the primary view.</li><li>Keep reference sources separate from original project artwork.</li><li>Label estimates and unfinished production work honestly.</li><li>Check links and access from a reviewer’s account.</li></ul></section><div class="next-links"><a class="link-button" href="${H('character-concept')}">Inspect character boards</a><a class="link-button" href="${H('states')}">Read the state contract</a></div></article>`'''

          CSS = '''/* Instant Deliverables: reuse the Crash presentation layout without changing other sections. */
          .pirate-review .instant-deliverables #figma{margin-bottom:0}
          .pirate-review .instant-deliverables .delivery-links{margin-block:0}
          .pirate-review .instant-deliverables .delivery-links a{min-height:0}
          .pirate-review .instant-deliverables .delivery-links span{font-size:12px}
          .pirate-review .instant-deliverables .submission-grid{align-items:stretch}
          .pirate-review .instant-deliverables #copy-status:empty{display:none}
          .pirate-review .instant-deliverables #figma-url:not([hidden]){margin-top:16px;padding:10px;border:1px solid var(--border);border-radius:6px;font:inherit;min-width:0}
          .pirate-review .instant-deliverables .submission-card{min-width:0}
          .pirate-review .instant-deliverables .submission-card .preview-actions{flex-wrap:wrap}
          '''

          # Plan every change before writing anything. A changed structure fails safely.
          js_path = ROOT/'instant-review.js'
          js = js_path.read_text()
          start = js.find(' deliverables:()=>')
          end = js.find('\n };', start)
          if start < 0 or end < 0:
              raise SystemExit('Instant page structure changed. No files modified; review the update first.')
          new_js = js[:start] + DELIVERABLES + js[end:]
          new_js, n = re.subn(r"instant-review\.css\?v=[^'\"]+", 'instant-review.css?v='+VERSION, new_js)
          if n != 1:
              raise SystemExit('Expected one Instant stylesheet reference; no files modified.')
          # Preserve the existing copy action, while making its denied-permission fallback usable.
          new_js = new_js.replace("input.hidden=false;input.select();", "input.hidden=false;input.focus();input.select();")

          css_path = ROOT/'instant-review.css'
          css = css_path.read_text()
          marker = '/* Instant Deliverables: reuse the Crash presentation layout'
          if marker in css:
              css = css[:css.index(marker)].rstrip()+'\n'
          new_css = css.rstrip()+'\n\n'+CSS

          index_path = ROOT/'instant/index.html'
          index = index_path.read_text()
          match = re.search(r'<script type="importmap">(.*?)</script>', index)
          imports = json.loads(match.group(1)) if match else {'imports':{}}
          new_url = '/game-art-review/instant-review.js?v='+VERSION
          for key in list(imports['imports']):
              if key.startswith('/game-art-review/instant-review.js'):
                  imports['imports'][key] = new_url
          # Read the actual loader, rather than relying on a guessed last cache tag.
          loader = (ROOT/'site.js').read_text()
          modules = re.findall(r"['\"](/game-art-review/instant-review\.js(?:\?[^'\"]*)?)['\"]", loader)
          if not modules:
              raise SystemExit('Instant module import was not found. No files modified.')
          for key in modules:
              if key != new_url:
                  imports['imports'][key] = new_url
          imports['imports']['/game-art-review/instant-review.js'] = new_url
          import_tag = '<script type="importmap">'+json.dumps(imports,separators=(',',':'))+'</script>'
          if match:
              new_index = index[:match.start()]+import_tag+index[match.end():]
          else:
              new_index = index.replace('<script src=',import_tag+'<script src=',1)

          pdf_path = ROOT/PDF
          if not pdf_path.is_file() or pdf_path.stat().st_size < 100_000:
              raise SystemExit('The new 25-page PDF must exist before updating the links.')

          for path, content in [(js_path,new_js),(css_path,new_css),(index_path,new_index)]:
              path.write_text(content)
              print('Updated',path.relative_to(ROOT))
          print('Linked',PDF)
          print('Crash, other Instant sections, original exports and original download manifests are unchanged.')

          PY_PATCH
      - name: Validate the PDF and website changes
        run: |
          node --check instant-review.js
          node --check site.js
          python - <<'PY_CHECK'
          from pathlib import Path
          import fitz, re, json, subprocess
          root=Path.cwd()
          pdf=root/'assets/instant-final/downloads/Pirate_Sea_Hop_Test_Presentation_25p.pdf'
          doc=fitz.open(pdf)
          assert len(doc)==25
          assert len(doc.get_toc())==25
          assert all(page.get_text().strip() for page in doc)
          expected={f'{device}-{i:02d}.webp' for device in ['mobile','desktop'] for i in range(1,11)}
          links={link.get('uri','').rsplit('/',1)[-1] for page in doc for link in page.get_links()}
          assert expected<=links, 'A final game screen is missing from the presentation.'
          assert any('L7QrdpDcaaWx9GkEgHsWWj' in link.get('uri','') for page in doc for link in page.get_links()), 'Missing Instant Figma link.'
          assert pdf.stat().st_size<90_000_000, 'PDF is too large for this commit.'
          js=(root/'instant-review.js').read_text()
          assert 'instant-deliverables' in js and 'Pirate_Sea_Hop_Test_Presentation_25p.pdf' in js
          assert 'What is ready. What remains.' in js
          assert 'tentacles-combined.png' in js and 'kraken-losing-state-03.png' in js
          assert 'const gameScreens=active' in js, 'Game screen behavior was unexpectedly changed.'
          # The existing download reassembly must not overwrite the new presentation.
          manifest=json.loads((root/'source-notes/instant-downloads.json').read_text())
          assert all(entry['path']!=str(pdf.relative_to(root)) for entry in manifest)
          allowed={'instant-review.js','instant-review.css','instant/index.html','assets/instant-final/downloads/Pirate_Sea_Hop_Test_Presentation_25p.pdf'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed<=allowed, 'Unexpected tracked file changes: '+str(changed-allowed)
          print('PASS: 25 pages, all 20 screens, working PDF structure, Instant Figma link, scoped website changes.')

          PY_CHECK
      - name: Commit only the Instant deliverables update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- instant-review.js instant-review.css instant/index.html assets/instant-final/downloads/Pirate_Sea_Hop_Test_Presentation_25p.pdf
          if git diff --cached --quiet; then
            echo 'The Instant Deliverables update is already applied.'
          else
            git commit -m 'Match Instant Deliverables to Crash and add matching 25-page presentation'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Request the existing GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run deploy-pages.yml --ref main
          echo '## Instant Deliverables update committed' >> "$GITHUB_STEP_SUMMARY"
          echo 'The 25-page presentation and matching layout have been committed. The existing Deploy Game Art Review workflow has been requested. Wait for that workflow to finish before reviewing the public page.' >> "$GITHUB_STEP_SUMMARY"
