name: Restore full-size presentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-presentation.yml'
      - 'source-notes/pdf-upload/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-presentation
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Recover and verify the original PDF
        run: |
          python3 - <<'PY'
          import hashlib, shutil, urllib.request
          from pathlib import Path
          expected = '82ac984c16fefbb4fedfce3b64e59e7f0a1832034a37e42dc5f784a3fd0a8db4'
          target = Path('assets/deliverables/Cow_and_Aliens_Test_Presentation.pdf')
          parts = Path('source-notes/pdf-upload')
          if target.exists() and hashlib.sha256(target.read_bytes()).hexdigest() == expected:
              print('The exact original presentation is already present.')
              raise SystemExit(0)
          names = [parts / 'part-01.bin', parts / 'part-02.bin']
          if all(p.is_file() for p in names):
              data = b''.join(p.read_bytes() for p in names)
          else:
              url = 'https://game-art-review.cocoa-ball-5078.chatgpt.site/assets/deliverables/Cow_and_Aliens_Test_Presentation.pdf'
              request = urllib.request.Request(url, headers={'User-Agent': 'Game-Art-Review-Migration/1.0'})
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = response.read()
                  print('Source response:', response.status, response.headers.get('Content-Type'), len(data), 'bytes')
          digest = hashlib.sha256(data).hexdigest()
          if digest != expected:
              raise SystemExit('Refusing to commit: source PDF does not match the approved export. SHA256: ' + digest)
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          if parts.exists():
              shutil.rmtree(parts)
          print('Verified exact original presentation:', len(data), 'bytes;', digest)
          PY
      - name: Commit verified presentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/deliverables/Cow_and_Aliens_Test_Presentation.pdf
          if git ls-files --error-unmatch source-notes/pdf-upload/part-01.bin >/dev/null 2>&1; then
            git add -u source-notes/pdf-upload/
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Restore byte-identical approved presentation PDF'
            git push
          fi
