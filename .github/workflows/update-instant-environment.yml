name: Update Instant environment artwork

on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-instant-environment.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: instant-environment-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Replace only the supplied main environment route image
        run: |
          python3 - <<'PY'
          import hashlib, json, re, struct, urllib.request
          from pathlib import Path

          version = '20260922-environment-route-v2'
          image = Path('assets/instant-final/art/environment-overview.png')
          expected = 'a5a708c96776b3c3ae6257e766185767723305edb690d9b3801c027ad4ef3daa'
          url = 'https://pikaso.cdnpk.net/private/production/5512807611/3622228693.png?token=exp=1790294400~hmac=98724b57a2c286d7909b1687a69cc67c5ce4e74e46d1eddcfd454ca0f04e6ac9'
          if image.exists() and hashlib.sha256(image.read_bytes()).hexdigest() == expected:
              data = image.read_bytes()
          else:
              request = urllib.request.Request(url, headers={'User-Agent': 'GameArtReview-AssetImport/1.0'})
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = response.read()
          assert hashlib.sha256(data).hexdigest() == expected, 'Downloaded PNG differs from the user upload.'
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'Not a PNG.'
          assert struct.unpack('>II', data[16:24]) == (374, 1412), 'Unexpected image dimensions.'

          path = Path('instant-review.js')
          original = path.read_text()
          matches = [line for line in original.splitlines() if line.lstrip().startswith('const mainEnvironment=')]
          assert len(matches) == 1, 'Main environment renderer changed; refusing an unsafe edit.'
          old = matches[0]
          assert 'Main environment · complete route' in old
          assert 'Full composition, from the starting ship to the treasure island.' in old
          new, count = re.subn(r"art/environment-overview\.png(?:\?v=[^']+)?", 'art/environment-overview.png?v=' + version, old)
          assert count == 1, 'Main environment image reference changed.'
          new, count = re.subn(r'width="\d+" height="\d+"', 'width="374" height="1412"', new)
          assert count == 1, 'Main environment image dimensions changed.'
          updated = original.replace(old, new, 1)
          assert updated.replace(new, old, 1) == original, 'Unexpected change outside the main environment renderer.'

          site = Path('site.js')
          site_original = site.read_text()
          module_pattern = r"/game-art-review/instant-review\.js\?v=[^'\"]+"
          modules = re.findall(module_pattern, site_original)
          assert len(modules) == 1, 'Instant module loader changed.'
          module_url = '/game-art-review/instant-review.js?v=' + version
          site_updated, count = re.subn(module_pattern, module_url, site_original)
          assert count == 1

          index = Path('instant/index.html')
          html = index.read_text()
          import_map_pattern = r'(<script type="importmap">)(.*?)(</script>)'
          def update_import_map(match):
              value = json.loads(match.group(2))
              imports = value.setdefault('imports', {})
              for key, target in list(imports.items()):
                  if isinstance(target, str) and '/instant-review.js' in target:
                      imports[key] = module_url
              imports[modules[0]] = module_url
              return match.group(1) + json.dumps(value, separators=(',', ':')) + match.group(3)
          if 'type="importmap"' in html:
              html, count = re.subn(import_map_pattern, update_import_map, html, flags=re.S)
              assert count == 1, 'Instant import map changed.'
          html, count = re.subn(r'site\.js\?v=[^\"]+', 'site.js?v=' + version, html)
          assert count == 1, 'Instant entry point changed.'

          image.parent.mkdir(parents=True, exist_ok=True)
          image.write_bytes(data)
          path.write_text(updated)
          site.write_text(site_updated)
          index.write_text(html)
          print('Replaced the main environment image with the byte-identical user PNG: 374 x 1412.')
          print('SHA-256:', expected)
          print('Only the main environment image, its dimensions and cache versions were changed.')
          print('All other images, captions, galleries, styles, PDFs and sections are preserved.')
          PY
      - name: Validate JavaScript
        run: |
          node --check instant-review.js
          node --check site.js
      - name: Commit the environment image replacement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/instant-final/art/environment-overview.png instant-review.js site.js instant/index.html
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m 'Replace Main environment complete route with the latest 374x1412 upload'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "Environment image replacement commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish through the existing GitHub Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main --repo "$GITHUB_REPOSITORY"
