name: Update Instant environment artwork

on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-instant-environment.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: instant-environment-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Import the supplied image and update only the Environment presentation
        run: |
          python3 - <<'PY'
          import hashlib, json, re, urllib.request
          from pathlib import Path

          version = '20260921-environment-v1'
          image = Path('assets/instant-final/art/environment-overview.png')
          expected = 'b2d73dab0156a0d1baed6999081120fe7cd3c120256a5df3407314b9b463ef2a'
          url = 'https://pikaso.cdnpk.net/private/production/5512576109/3622119033.png?token=exp=1790294400~hmac=5dcab4df728198369179c0cbd8be14657a06ed15eee4f4b5b6e08a230dc0902f'
          if not image.exists() or hashlib.sha256(image.read_bytes()).hexdigest() != expected:
              request = urllib.request.Request(url, headers={'User-Agent': 'GameArtReview-AssetImport/1.0'})
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = response.read()
              if hashlib.sha256(data).hexdigest() != expected:
                  raise SystemExit('The downloaded image does not match the supplied original PNG.')
              image.parent.mkdir(parents=True, exist_ok=True)
              image.write_bytes(data)

          extra_files = [
              '8DE0DFBE-D82A-4782-AB74-D2524A0C4BA6.webp',
              'F982C7ED-7785-4E4F-85E4-7C7DF54AD07F.webp',
              '419855C5-4950-46AC-8252-38AEF175F3D4.webp',
          ]
          manifest = json.loads(Path('assets/instant-final/manifest.json').read_text())
          for filename in extra_files:
              assert (image.parent / filename).is_file(), filename
              assert sum(a['file'] == filename for a in manifest['assets']) == 1, filename

          path = Path('instant-review.js')
          text = path.read_text()
          if 'const environmentExtraFiles=' not in text:
              helpers = ''' const environmentExtraFiles=['8DE0DFBE-D82A-4782-AB74-D2524A0C4BA6.webp','F982C7ED-7785-4E4F-85E4-7C7DF54AD07F.webp','419855C5-4950-46AC-8252-38AEF175F3D4.webp'];
           const mainEnvironment=()=>fig('art/environment-overview.png','Main environment · complete route','Full composition, from the starting ship to the treasure island.').replace('class="pirate-figure"','class="pirate-figure instant-environment-hero"').replace('loading="lazy"','loading="eager" fetchpriority="high" width="375" height="1818"');
           const environmentGallery=()=>`<div class="instant-asset-grid" aria-label="Environment assets">${[...m.assets.filter(a=>a.category==='environment'&&!environmentExtraFiles.includes(a.file)),...environmentExtraFiles.map(file=>m.assets.find(a=>a.file===file))].filter(Boolean).map(a=>fig('art/'+a.file,a.title)).join('')}</div>`;
          '''
              assert text.count(' const pages={') == 1, 'Page map changed; refusing an unsafe edit.'
              text = text.replace(' const pages={', helpers + ' const pages={', 1)
              old = next(line for line in text.splitlines() if line.lstrip().startswith('environment:'))
              assert old.count("+gallery('environment')+") == 1, 'Environment renderer changed.'
              new = old.replace("+gallery('environment')+", '+mainEnvironment()+environmentGallery()+', 1)
              text = text.replace(old, new, 1)
          assert '+mainEnvironment()+environmentGallery()+' in text
          text, count = re.subn(r"instant-review\.css\?v=[^'\"]+", 'instant-review.css?v=' + version, text)
          assert count == 1, 'Stylesheet reference changed.'
          path.write_text(text)

          css = Path('instant-review.css')
          styles = css.read_text()
          if '/* Environment overview: preserve the entire supplied composition. */' not in styles:
              styles += '''
          /* Environment overview: preserve the entire supplied composition. */
          .pirate-review .pirate-figure.instant-environment-hero{width:100%;max-width:420px;margin:0 auto 36px;box-sizing:border-box}
          .pirate-review .instant-environment-hero a{display:block}
          .pirate-review .instant-environment-hero img{display:block;width:100%;height:auto;max-height:none;object-fit:contain;padding:0}
          '''
              css.write_text(styles)

          site = Path('site.js')
          text, count = re.subn(r"instant-review\.js\?v=[^'\"]+", 'instant-review.js?v=' + version, site.read_text())
          assert count == 1, 'Instant module reference changed.'
          site.write_text(text)
          index = Path('instant/index.html')
          text, count = re.subn(r'site\.js\?v=[^\"]+', 'site.js?v=' + version, index.read_text())
          assert count == 1, 'Instant entry point changed.'
          index.write_text(text)
          print('Imported byte-identical main PNG (375 x 1818).')
          print('Preserved', sum(a['category']=='environment' for a in manifest['assets']), 'existing environment assets; appended mermaid tail and the two tentacles in the supplied order.')
          print('The manifest, character artwork, art-direction references, PDFs and other page content are unchanged.')
          PY
      - name: Validate JavaScript
        run: |
          node --check instant-review.js
          node --check site.js
      - name: Commit the environment update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/instant-final/art/environment-overview.png instant-review.js instant-review.css site.js instant/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Show full environment overview first and include mermaid tail and both tentacles'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "Environment update commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish through the existing GitHub Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main --repo "$GITHUB_REPOSITORY"
