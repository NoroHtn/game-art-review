name: Apply final review retouch

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: final-review-retouch
  cancel-in-progress: false

jobs:
  retouch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-urw-base35
          python -m pip install 'PyMuPDF==1.26.6' reportlab fonttools pillow
      - name: Apply audited changes and preserve artwork
        env:
          RETOUCH_PAYLOAD: 
        run: |
          python - <<'PY'
          import os, json, base64, zlib, hashlib, subprocess
          from pathlib import Path
          p=json.loads(zlib.decompress(base64.b64decode(os.environ['RETOUCH_PAYLOAD'])))
          # Check all original hashes before changing anything. Never overwrite newer work.
          for name,expected in p['originals'].items():
              actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit('Source changed since audit; stopped without edits: '+name)
          for name,content in p['files'].items():
              Path(name).write_text(content)
          exec(compile(p['pdf_script'],'verified-pdf-retouch','exec'), {'__name__':'__main__'})
          for name in p['files']:
              if name.endswith('.js'):
                  subprocess.run(['node','--check',name],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--']+list(p['originals']),check=True)
          PY
      - name: Commit the verified retouch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Retouch final review copy and align production plans'
          git push origin HEAD:main
      - name: Publish through the existing Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
