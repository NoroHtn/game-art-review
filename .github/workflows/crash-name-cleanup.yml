name: Crash naming cleanup

on:
  push:
    branches: [main]
    paths: ['.github/workflows/crash-name-cleanup.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install PDF inspection tools
        run: python -m pip install PyMuPDF==1.26.7 Pillow==11.3.0
      - name: Inspect current files and render the presentation
        run: |
          python - <<'PY'
          import json, re, os, shutil, zipfile
          from pathlib import Path
          import fitz
          from PIL import Image, ImageDraw
          root=Path.cwd()
          out=Path(os.environ['RUNNER_TEMP'])/'crash-name-audit'
          out.mkdir()
          pattern=re.compile(r'moo[\W_]*napped!?',re.I)
          report={'text_matches':[], 'name_matches':[], 'pdfs':[], 'archives':[], 'files':[]}
          text_ext={'.html','.js','.mjs','.css','.json','.md','.txt','.svg','.xml','.yml','.yaml','.csv'}
          for path in sorted(root.rglob('*')):
              if not path.is_file() or '.git' in path.parts: continue
              rel=path.relative_to(root).as_posix()
              report['files'].append([rel,path.stat().st_size])
              if pattern.search(rel): report['name_matches'].append(rel)
              if path.suffix.lower() in text_ext:
                  try: text=path.read_text()
                  except UnicodeError: continue
                  for m in pattern.finditer(text):
                      report['text_matches'].append({'path':rel,'line':text[:m.start()].count('\n')+1,'context':text[max(0,m.start()-100):m.end()+120]})
              if path.suffix.lower()=='.pdf':
                  doc=fitz.open(path)
                  info={'path':rel,'pages':len(doc),'metadata':doc.metadata,'matches':[],'page_text':[]}
                  for p in doc:
                      text=p.get_text()
                      info['page_text'].append({'page':p.number+1,'text':text})
                      for b in p.get_text('dict')['blocks']:
                          for line in b.get('lines',[]):
                              for span in line['spans']:
                                  if pattern.search(span['text']):
                                      info['matches'].append({'page':p.number+1,**span})
                  report['pdfs'].append(info)
                  if 'Cow_and_Aliens_Test_Presentation' in path.name:
                      shutil.copy2(path,out/path.name)
                      thumbs=[]
                      for p in doc:
                          pix=p.get_pixmap(matrix=fitz.Matrix(0.6,0.6),alpha=False)
                          image=Image.frombytes('RGB',[pix.width,pix.height],pix.samples)
                          image.thumbnail((480,300))
                          cell=Image.new('RGB',(500,330),'white')
                          cell.paste(image,((500-image.width)//2,20))
                          ImageDraw.Draw(cell).text((12,310),f'Page {p.number+1}',fill='black')
                          thumbs.append(cell)
                          if p.number==0 or any(x['page']==p.number+1 for x in info['matches']):
                              p.get_pixmap(matrix=fitz.Matrix(1.3,1.3),alpha=False).save(out/f'page-{p.number+1:02d}.png')
                      for start in range(0,len(thumbs),9):
                          sheet=Image.new('RGB',(1500,990),'#cccccc')
                          for i,img in enumerate(thumbs[start:start+9]): sheet.paste(img,((i%3)*500,(i//3)*330))
                          sheet.save(out/f'contact-{start//9+1}.jpg',quality=88)
              if path.suffix.lower()=='.zip':
                  try:
                      with zipfile.ZipFile(path) as z:
                          hits=[]
                          for name in z.namelist():
                              if pattern.search(name): hits.append(name)
                              if Path(name).suffix.lower() in text_ext:
                                  try:
                                      if pattern.search(z.read(name).decode('utf-8')): hits.append(name)
                                  except UnicodeError: pass
                          report['archives'].append({'path':rel,'matches':hits})
                  except zipfile.BadZipFile: pass
          (out/'audit.json').write_text(json.dumps(report,indent=2))
          print('TEXT MATCHES:',json.dumps(report['text_matches'],indent=2))
          print('FILENAME MATCHES:',report['name_matches'])
          print('ARCHIVES:',json.dumps(report['archives']))
          print('PDF MATCHES:',json.dumps([{k:v for k,v in x.items() if k!='page_text'} for x in report['pdfs']],indent=2))
          print('CRASH PDF TEXT:',json.dumps([{'path':x['path'],'pages':x['page_text']} for x in report['pdfs'] if 'Cow_and_Aliens' in x['path']],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crash-name-audit
          path: ${{ runner.temp }}/crash-name-audit
          retention-days: 7
