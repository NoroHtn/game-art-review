name: Crash naming cleanup

on:
  push:
    branches: [main]
    paths: ['.github/workflows/crash-name-cleanup.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: crash-label-cleanup
  cancel-in-progress: false

jobs:
  clean-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Install inspection tools
        run: |
          python -m pip install PyMuPDF==1.26.7 playwright==1.55.0
          if [ ! -f /usr/share/fonts/opentype/urw-base35/URWBookman-Demi.otf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-urw-base35
          fi
          if ! command -v google-chrome >/dev/null; then
            python -m playwright install --with-deps chromium
          fi
      - name: Remove the retired label and verify PDF preservation
        run: python .github/scripts/clean-crash-label.py apply
      - name: Validate all JavaScript
        run: |
          find . -path './.git' -prune -o -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Test every crash section in a real browser
        run: |
          python -m http.server 8765 --directory "$GITHUB_WORKSPACE/.." > "$RUNNER_TEMP/crash-http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          python - <<'PY'
          import json, os, re, shutil, time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path(os.environ['RUNNER_TEMP'])/'crash-cleanup-results'
          old=re.compile(r'moo[\W_]*napped!?',re.I)
          routes=['','brief/','art-direction/','character-concept/','environment/','final-ui/','states/','animation/','production/','deliverables/','desktop/','mobile/','components/','specification/']
          results=[]
          time.sleep(1)
          with sync_playwright() as p:
              chrome=shutil.which('google-chrome')
              browser=p.chromium.launch(headless=True,executable_path=chrome or None,args=['--no-sandbox'])
              page=browser.new_page(viewport={'width':1440,'height':1000})
              errors=[]
              page.on('pageerror',lambda error: errors.append(str(error)))
              for route in routes:
                  response=page.goto('http://127.0.0.1:8765/game-art-review/'+route,wait_until='networkidle')
                  assert response.status==200,route
                  page.wait_for_selector('#content h1')
                  body=page.locator('body').inner_text()
                  assert not old.search(body+page.title()),route
                  assert 'This section could not load.' not in body,route
                  assert 'The workspace could not load.' not in body,route
                  if route in ('','brief/'):
                      assert 'About the name' not in body
                      assert 'This character-led crash concept is built around' in body
                  if route=='deliverables/':
                      href=page.get_by_role('link',name='Open PDF',exact=True).get_attribute('href')
                      assert '20260922-crash-label-cleanup' in href
                  for frame in page.frames:
                      assert not old.search(frame.content()),route+' iframe'
                  broken=page.locator('img').evaluate_all('(images)=>images.filter(i=>i.complete && !i.naturalWidth).map(i=>i.src)')
                  assert not broken,{'route':route,'broken_images':broken}
                  results.append({'route':route or '/','title':page.title(),'status':'passed'})
                  if route=='':page.screenshot(path=str(out/'website-desktop.png'))
                  if route=='deliverables/':page.screenshot(path=str(out/'website-deliverables.png'))
              page.set_viewport_size({'width':390,'height':844})
              page.goto('http://127.0.0.1:8765/game-art-review/',wait_until='networkidle')
              page.wait_for_selector('#content h1')
              assert not old.search(page.locator('body').inner_text()+page.title())
              page.screenshot(path=str(out/'website-mobile.png'))
              page.goto('http://127.0.0.1:8765/game-art-review/instant/',wait_until='networkidle')
              page.wait_for_selector('#content h1')
              assert 'Pirate Sea Hop' in page.title()
              assert not old.search(page.content())
              assert not errors,errors
              browser.close()
          (out/'browser-checks.json').write_text(json.dumps(results,indent=2))
          print('BROWSER CHECKS PASSED:',len(results),'crash routes, mobile layout, and Instant regression check.')
          PY
      - name: Commit the website and updated presentation
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'Remove retired crash title from all pages, previews and presentation PDF'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Deploy the updated website
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          run_id=''
          for attempt in $(seq 1 20); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-pages.yml --branch main --commit "$CHANGE_SHA" --event workflow_dispatch --limit 5 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          test -n "$run_id"
          echo "Deployment run: $run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 5
      - name: Verify live pages and the exact updated PDF
        run: python .github/scripts/clean-crash-label.py verify-live
      - name: Save verification evidence and updated PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-cleanup-verified
          path: ${{ runner.temp }}/crash-cleanup-results
          retention-days: 14
